# ============================================================
# Self-hosted Docker Registry for Mini Booking System
# ============================================================
# Thay the GHCR khi GitHub account bi suspended.
# Registry nay chay tren VPS, su dung TLS (Let's Encrypt) va basic auth.
#
# Setup:  bash infra/scripts/setup-registry.sh <domain> <user> <password>
# Start:  docker compose -f infra/docker-compose.registry.yml up -d
# Stop:   docker compose -f infra/docker-compose.registry.yml down
#
# Khi chuyen lai GitHub Actions, chi can stop registry va doi
# REGISTRY=ghcr.io trong .env.production
# ============================================================

services:
  registry:
    image: registry:2
    container_name: docker_registry
    restart: always
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_HTTP_TLS_CERTIFICATE: /certs/live/${REGISTRY_DOMAIN}/fullchain.pem
      REGISTRY_HTTP_TLS_KEY: /certs/live/${REGISTRY_DOMAIN}/privkey.pem
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Mini Booking Registry"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      # Garbage collection: giu lai 50 revision moi nhat
      REGISTRY_STORAGE_MAINTENANCE_READONLY_ENABLED: "false"
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
      - ./registry-auth:/auth:ro
      - ssl_certs:/certs:ro
    networks:
      - booking_network
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "-q", "https://localhost:5000/v2/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  registry_data:
    driver: local
  ssl_certs:
    external: true
    name: infra_ssl_certs

networks:
  booking_network:
    external: true
    name: infra_booking_network
