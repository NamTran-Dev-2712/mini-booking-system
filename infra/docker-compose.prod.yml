x-api-common: &api-common
  image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX}/api:${IMAGE_TAG:-latest}
  restart: unless-stopped
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_URLS: http://+:8080
    ConnectionStrings__DefaultConnection: Host=postgres_db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    Redis__ConnectionString: redis_cache:6379,password=${REDIS_PASSWORD},abortConnect=false
    Redis__InstanceName: "booking:prod:"
    JwtSettings__Secret: ${JWT_SECRET}
    JwtSettings__Issuer: ${JWT_ISSUER}
    JwtSettings__Audience: ${JWT_AUDIENCE}
    Google__ClientId: ${GOOGLE_CLIENT_ID}
    Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
    Resend__ApiKey: ${RESEND_API_KEY}
    Resend__FromEmail: ${RESEND_FROM_EMAIL}
    Resend__FromName: ${RESEND_FROM_NAME}
    MiniMax__ApiKey: ${MINIMAX_API_KEY}
    SePay__WebhookApiKey: ${SEPAY_WEBHOOK_KEY}
    SePay__BankShortName: ${SEPAY_BANK_SHORT_NAME}
    SePay__AccountNumber: ${SEPAY_ACCOUNT_NUMBER}
    SePay__AccountName: ${SEPAY_ACCOUNT_NAME}
    BaseUrl__Api: ${API_BASE_URL}
    BaseUrl__Frontend: ${FRONTEND_URL}
    Cors__AllowedOrigins__0: ${FRONTEND_URL}
    ReverseProxy__TrustedProxies__0: nginx
    AdminSettings__Email: ${ADMIN_EMAIL:-}
  volumes:
    - api_uploads:/app/uploads
    - api_logs:/app/logs
  networks:
    - booking_network
  depends_on:
    postgres_db:
      condition: service_healthy
    redis_cache:
      condition: service_healthy
  deploy:
    resources:
      limits:
        cpus: "${CPU_LIMIT_API:-1.0}"
        memory: ${MEM_LIMIT_API:-512m}
      reservations:
        memory: 256m

x-web-common: &web-common
  image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX}/web:${IMAGE_TAG:-latest}
  restart: unless-stopped
  environment:
    - NODE_ENV=production
    - PORT=3000
    - VITE_API_URL=${API_BASE_URL}
  networks:
    - booking_network
  deploy:
    resources:
      limits:
        cpus: "${CPU_LIMIT_WEB:-0.5}"
        memory: ${MEM_LIMIT_WEB:-256m}
      reservations:
        memory: 128m

services:
  # ─── Blue-Green API ───────────────────────────────────────
  api-blue:
    <<: *api-common
    container_name: api-blue
    profiles: ["blue"]

  api-green:
    <<: *api-common
    container_name: api-green
    profiles: ["green"]

  # ─── Blue-Green Web ───────────────────────────────────────
  web-blue:
    <<: *web-common
    container_name: web-blue
    profiles: ["blue"]

  web-green:
    <<: *web-common
    container_name: web-green
    profiles: ["green"]

  # ─── Infrastructure (always running) ─────────────────────
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
    networks:
      - booking_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT_POSTGRES:-1.0}"
          memory: ${MEM_LIMIT_POSTGRES:-1g}
        reservations:
          memory: 256m

  redis_cache:
    image: redis:7-alpine
    container_name: redis_prod
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY:-400mb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      --appendonly yes
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    networks:
      - booking_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT_REDIS:-0.5}"
          memory: ${MEM_LIMIT_REDIS:-512m}
        reservations:
          memory: 128m

  # ─── Nginx Reverse Proxy ─────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/active-upstream.conf:/etc/nginx/active-upstream.conf:ro
      - ssl_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    networks:
      - booking_network

  # ─── Certbot (SSL auto-renewal) ─────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ssl_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - booking_network

volumes:
  postgres_data:
  postgres_backups:
  redis_data:
  api_uploads:
  api_logs:
  ssl_certs:
  certbot_webroot:

networks:
  booking_network:
    driver: bridge
