name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test backend
        run: |
          dotnet restore api/MiniBookingSystem.slnx
          dotnet test api/MiniBookingSystem.slnx -c Release --verbosity minimal

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Typecheck frontend
        run: |
          cd web && bun install --frozen-lockfile && bun run typecheck

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "repo_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/api:${{ steps.meta.outputs.sha_short }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.PRODUCTION_API_URL }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/web:${{ steps.meta.outputs.sha_short }}
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Generate .env.production on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
            cat > /opt/mini-booking-system/.env.production <<'ENVEOF'
            FRONTEND_DOMAIN=${{ secrets.FRONTEND_DOMAIN }}
            API_DOMAIN=${{ secrets.API_DOMAIN }}
            SSL_EMAIL=${{ secrets.SSL_EMAIL }}
            API_BASE_URL=${{ secrets.PRODUCTION_API_URL }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            VITE_API_URL=${{ secrets.PRODUCTION_API_URL }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            REDIS_MAXMEMORY=${{ vars.REDIS_MAXMEMORY }}
            REDIS_MAXMEMORY_POLICY=${{ vars.REDIS_MAXMEMORY_POLICY }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ISSUER=${{ secrets.JWT_ISSUER }}
            JWT_AUDIENCE=${{ secrets.JWT_AUDIENCE }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            MINIMAX_API_KEY=${{ secrets.MINIMAX_API_KEY }}
            SEPAY_WEBHOOK_KEY=${{ secrets.SEPAY_WEBHOOK_KEY }}
            SEPAY_BANK_SHORT_NAME=${{ secrets.SEPAY_BANK_SHORT_NAME }}
            SEPAY_ACCOUNT_NUMBER=${{ secrets.SEPAY_ACCOUNT_NUMBER }}
            SEPAY_ACCOUNT_NAME=${{ secrets.SEPAY_ACCOUNT_NAME }}
            IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            CPU_LIMIT_API=${{ vars.CPU_LIMIT_API }}
            MEM_LIMIT_API=${{ vars.MEM_LIMIT_API }}
            CPU_LIMIT_WEB=${{ vars.CPU_LIMIT_WEB }}
            MEM_LIMIT_WEB=${{ vars.MEM_LIMIT_WEB }}
            CPU_LIMIT_POSTGRES=${{ vars.CPU_LIMIT_POSTGRES }}
            MEM_LIMIT_POSTGRES=${{ vars.MEM_LIMIT_POSTGRES }}
            CPU_LIMIT_REDIS=${{ vars.CPU_LIMIT_REDIS }}
            MEM_LIMIT_REDIS=${{ vars.MEM_LIMIT_REDIS }}
            ENVEOF
            echo "GITHUB_REPOSITORY=${REPO_LOWER}" >> /opt/mini-booking-system/.env.production
            sed -i 's/^[[:space:]]*//' /opt/mini-booking-system/.env.production
            chmod 600 /opt/mini-booking-system/.env.production

      - name: Deploy to VPS
        id: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/mini-booking-system
            git pull origin main
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            export GITHUB_REPOSITORY=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            bash infra/scripts/deploy.sh $IMAGE_TAG

      - name: Rollback on failure
        if: ${{ failure() && steps.deploy.outcome == 'failure' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/mini-booking-system
            bash infra/scripts/rollback.sh
