
services:
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ${DB_DATA_PATH}:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_POSTGRES}'
          memory: ${MEM_LIMIT_POSTGRES}
        reservations:
          memory: 256m

  redis_cache:
    image: redis:7-alpine
    container_name: redis_prod
    restart: always
    # Config trực tiếp qua command để đạt chuẩn Production
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY}
      --appendonly yes
      --save 900 1
      --save 300 10
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ${REDIS_DATA_PATH}:/data
    networks:
      - booking_network
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_REDIS}'
          memory: ${MEM_LIMIT_REDIS}
        reservations:
          memory: 128m

volumes:
  postgres_data:
  redis_data:

networks:
  booking_network: